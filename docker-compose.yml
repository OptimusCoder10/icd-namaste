version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: namaste
      POSTGRES_PASSWORD: namaste123
      POSTGRES_DB: namaste_icd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namaste"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - AI_SERVICE_PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://namaste:namaste123@postgres:5432/namaste_icd
      - JWT_SECRET=namaste-icd11-local-secret
      - AI_SERVICE_URL=http://ai-service:8001
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  expo-web:
    build:
      context: .
      dockerfile: Dockerfile.expo
    ports:
      - "3000:3000"
    environment:
      - EXPO_PUBLIC_DOMAIN=localhost:8080
    depends_on:
      - api-server

volumes:
  postgres_data:
