version: "3.9"

# ─────────────────────────────────────────────────────────────────
# NAMASTE-ICD11 — Local Docker Stack
#
# Quick start:
#   docker compose up --build
#
# Then open:
#   Web app  → http://localhost:3000
#   API      → http://localhost:8080
#   AI OCR   → http://localhost:8001
#   pgAdmin  → http://localhost:5050
#
# To use a different API host (e.g. a remote server):
#   EXPO_PUBLIC_DOMAIN=my-server.example.com docker compose up --build
# ─────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: namaste
      POSTGRES_PASSWORD: namaste123
      POSTGRES_DB: namaste_icd
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namaste -d namaste_icd"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      AI_SERVICE_PORT: "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://namaste:namaste123@postgres:5432/namaste_icd
      JWT_SECRET: namaste-icd11-local-secret-change-me
      AI_SERVICE_URL: http://ai-service:8001
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  expo-web:
    build:
      context: .
      dockerfile: Dockerfile.expo
      args:
        # The browser talks directly to the API — must be reachable from the user's machine
        EXPO_PUBLIC_DOMAIN: "localhost:8080"
        EXPO_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - api-server
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
